<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Мини-приложение</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
      text-align: center;
    }
    .screen { display: none; width: 100%; max-width: 360px; flex-direction: column; gap: 14px; }
    .screen.active { display: flex; }
    button {
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      transition: transform 0.1s;
    }
    button:active { transform: scale(0.97); }
    button.secondary {
      background-color: var(--tg-theme-secondary-bg-color, #e5e5ea);
      color: var(--tg-theme-text-color, #000000);
      margin-top: 20px;
    }
    /* Анимация 1: Пульсирующий круг */
    .pulse-circle {
      width: 100px; height: 100px; margin: 30px auto;
      border-radius: 50%; background: #ff4757;
      animation: pulse 1.2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(0.85); opacity: 0.7; }
      50% { transform: scale(1.2); opacity: 1; }
    }
    /* Анимация 2: Вращающийся квадрат */
    .spin-box {
      width: 90px; height: 90px; margin: 30px auto;
      border-radius: 18px; background: #2ed573;
      animation: spin 2s infinite linear;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .text-card {
      background: var(--tg-theme-secondary-bg-color, #f2f2f7);
      padding: 20px; border-radius: 14px; line-height: 1.5;
    }
  </style>
</head>
<body>
 
  <!-- Главное меню -->
  <div id="menu" class="screen active">
    <h2>Главное меню</h2>
    <button onclick="showScreen('anim1')">1. Первая анимация</button>
    <button onclick="showScreen('anim2')">2. Вторая анимация</button>
    <button onclick="showScreen('textScreen')">3. Показать текст</button>
  </div>
 
  <!-- Экран 1: Анимация 1 -->
  <div id="anim1" class="screen">
    <h3>Анимация №1</h3>
    <div class="pulse-circle"></div>
    <button class="secondary" onclick="showScreen('menu')">← Назад в меню</button>
  </div>
 
  <!-- Экран 2: Анимация 2 -->
  <div id="anim2" class="screen">
    <h3>Анимация №2</h3>
    <div class="spin-box"></div>
    <button class="secondary" onclick="showScreen('menu')">← Назад в меню</button>
  </div>
 
  <!-- Экран 3: Текст -->
  <div id="textScreen" class="screen">
    <h3>Информация</h3>
    <div class="text-card">
      Здесь размещается ваш текст. Приложение автоматически подстраивается под светлую и тёмную тему Telegram.
    </div>
    <button class="secondary" onclick="showScreen('menu')">← Назад в меню</button>
  </div>
 
  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand(); // Раскрывает окно на всю высоту
 
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }
  </script>
</body>
</html>
