<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f2f0" />
  <title>Приложение к постеру</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #dfddd6;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .screen {
      display: none;
      width: 100%;
      max-width: 430px;
      position: relative;
      background-color: #f2f2f0;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
    }

    .screen.active {
      display: block;
      animation: screenFadeIn 0.3s ease;
    }

    @keyframes screenFadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .screen-img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Прозрачная кликабельная область поверх кнопки на screen3 */
    .poster-btn {
      position: absolute;
      left: 40.5%;
      top: 92.4%;
      width: 55%;
      height: 4.9%;
      background: transparent;
      border: none;
      cursor: pointer;
      z-index: 3;
      transition: background-color 0.15s ease;
    }

    .poster-btn:hover {
      background-color: rgba(255, 255, 255, 0.08);
    }

    .poster-btn:active {
      background-color: rgba(0, 0, 0, 0.12);
    }

    /* Контейнер для анимированных полос слева вверху кнопки */
    .rays-overlay {
      position: absolute;
      left: 34%;
      top: 90.4%;
      width: 10%;
      height: 3.3%;
      pointer-events: none;
      z-index: 2;
      /* Перекрывает статичные полосы на исходной картинке */
      background-color: #f2f2f0;
      border-radius: 40%;
    }

    .btn-rays {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .btn-rays .ray {
      transform-origin: 44px 44px;
      animation: rayPulse 1.2s ease-in-out infinite;
    }

    .btn-rays .ray-1 { animation-delay: 0s; }
    .btn-rays .ray-2 { animation-delay: 0.14s; }
    .btn-rays .ray-3 { animation-delay: 0.28s; }

    @keyframes rayPulse {
      0%, 100% {
        transform: scale(0.55);
        opacity: 0.55;
      }
      50% {
        transform: scale(1.22);
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <!-- Первый экран -->
  <section id="screen3" class="screen active">
    <img src="./screen3.png" alt="Добро пожаловать в приложение к постеру" class="screen-img" />

    <!-- Анимированные полосы слева вверху кнопки -->
    <div class="rays-overlay" aria-hidden="true">
      <svg class="btn-rays" viewBox="0 0 50 50" fill="none">
        <path class="ray ray-1" d="M31 44 L5 41 L8 34 Z" stroke="#1c1c1c" stroke-width="2" stroke-linejoin="round" fill="none" />
        <path class="ray ray-2" d="M34 34 L12 15 L20 9 Z" stroke="#1c1c1c" stroke-width="2" stroke-linejoin="round" fill="none" />
        <path class="ray ray-3" d="M41 28 L33 4 L43 5 Z" stroke="#1c1c1c" stroke-width="2" stroke-linejoin="round" fill="none" />
      </svg>
    </div>

    <!-- Кликабельная кнопка перехода -->
    <button
      id="goToScreen4Btn"
      class="poster-btn"
      type="button"
      aria-label="Узнать про влияние примесей">
    </button>
  </section>

  <!-- Второй экран -->
  <section id="screen4" class="screen">
    <img src="./screen4.png" alt="Что такое родственные примеси" class="screen-img" />
  </section>

  <script>
    const screen3 = document.getElementById('screen3');
    const screen4 = document.getElementById('screen4');
    const goToScreen4Btn = document.getElementById('goToScreen4Btn');

    goToScreen4Btn.addEventListener('click', () => {
      screen3.classList.remove('active');
      screen4.classList.add('active');
      window.scrollTo(0, 0);
    });
  </script>
</body>
</html>
